<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GreenMountainFog - The Journey</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; width: 100%; height: 100%; }
    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container { position: relative; }
    canvas { display: block; image-rendering: pixelated; touch-action: none; }
    /* Touch controls overlay */
    #touch-controls {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      z-index: 1000;
      pointer-events: none;
    }
    @media (pointer: coarse) {
      #touch-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
    }
    .dpad {
      position: relative;
      width: 120px; height: 120px;
      pointer-events: auto;
    }
    .dpad-btn {
      position: absolute;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,215,0,0.5);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: rgba(255,255,255,0.8);
      touch-action: none;
    }
    .dpad-btn:active { background: rgba(255,215,0,0.5); }
    .dpad-up    { top: 0; left: 40px; }
    .dpad-down  { bottom: 0; left: 40px; }
    .dpad-left  { top: 40px; left: 0; }
    .dpad-right { top: 40px; right: 0; }
    .action-btn {
      width: 60px; height: 60px;
      background: rgba(46,139,87,0.4);
      border: 2px solid rgba(255,215,0,0.5);
      border-radius: 50%;
      color: rgba(255,255,255,0.9);
      font-size: 14px; font-weight: bold;
      font-family: 'Courier New', monospace;
      pointer-events: auto;
      touch-action: none;
    }
    .action-btn:active { background: rgba(255,215,0,0.5); }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-btn dpad-up" data-dir="up">▲</div>
      <div class="dpad-btn dpad-down" data-dir="down">▼</div>
      <div class="dpad-btn dpad-left" data-dir="left">◄</div>
      <div class="dpad-btn dpad-right" data-dir="right">►</div>
    </div>
    <button class="action-btn" id="btn-action">A</button>
  </div>
  <script>
    // Global touch state readable by Phaser
    window.touchDir = { up:false, down:false, left:false, right:false };
    window.touchAction = false;
    window.touchActionJust = false;

    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      btn.addEventListener('touchstart', e => { e.preventDefault(); window.touchDir[dir] = true; }, {passive:false});
      btn.addEventListener('touchend',   e => { e.preventDefault(); window.touchDir[dir] = false; }, {passive:false});
      btn.addEventListener('touchcancel',e => { window.touchDir[dir] = false; }, {passive:false});
    });
    const ab = document.getElementById('btn-action');
    ab.addEventListener('touchstart', e => { e.preventDefault(); window.touchAction = true; window.touchActionJust = true; }, {passive:false});
    ab.addEventListener('touchend',   e => { e.preventDefault(); window.touchAction = false; }, {passive:false});
    ab.addEventListener('touchcancel',e => { window.touchAction = false; }, {passive:false});
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
